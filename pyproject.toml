[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "slosizer"
description = "Profit-aware LLM capacity planning for latency SLOs, reserved throughput, and paygo overflow."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
  {name = "Gaurav Sood", email = "contact@gsood.com"}
]
keywords = ["llm", "capacity-planning", "cost-optimization", "slo", "vertex-ai", "azure-openai", "throughput", "latency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "pyarrow>=24,<25",
]
version = "0.3.1"

[project.urls]
Homepage = "https://github.com/gojiplus/slosizer"
Documentation = "https://gojiplus.github.io/slosizer"
Repository = "https://github.com/gojiplus/slosizer"
Changelog = "https://github.com/gojiplus/slosizer/blob/main/CHANGELOG.md"
Issues = "https://github.com/gojiplus/slosizer/issues"

[dependency-groups]
test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
]
dev = [
  { include-group = "test" },
  "ruff>=0.16.3",
  "deptry>=0.25.1",
  "vulture>=2.16",
  "pydoclint>=0.9.1",
  "pyright>=1.1.411",
  "pandas-stubs>=3.0.5.260730",
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
app = [
  "streamlit>=1.61.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300", "D105", "E501", "S106", "S107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]
"examples/**" = ["T201", "D100"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.deptry]
known_first_party = ["slosizer"]
extend_exclude = ["examples/output", "docs", "streamlit_app.py"]
ignore_notebooks = true

[tool.deptry.per_rule_ignores]
DEP002 = ["pyarrow"]

[tool.vulture]
paths = ["src", "tests", "examples"]
exclude = ["examples/output/", "docs/assets/"]
min_confidence = 80
sort_by_size = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.uv.build-backend]
module-name = "slosizer"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "slosizer"
description = "Capacity planning for reserved LLM throughput: latency, headroom, and synthetic workload simulation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
  {name = "Gaurav Sood", email = "contact@gsood.com"}
]
keywords = ["llm", "capacity-planning", "slo", "vertex-ai", "azure-openai", "throughput", "latency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/gojiplus/slosizer"
Documentation = "https://gojiplus.github.io/slosizer"
Repository = "https://github.com/gojiplus/slosizer"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "deptry",
  "vulture",
  "pydoclint",
  "pyright",
  "pandas-stubs>=3.0.3.260530",
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
app = [
  "streamlit>=1.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slosizer"]

[tool.hatch.version]
source = "uv-dynamic-versioning"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
# S106/S107: the `output_token_source` kwarg (LLM tokens) trips bandit's
# hardcoded-password heuristics
ignore = ["D203", "D213", "D105", "E501", "S106", "S107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]
"examples/**" = ["T201", "D100"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.deptry]
known_first_party = ["slosizer"]
extend_exclude = ["examples/output", "docs/assets"]
ignore_notebooks = true

[tool.vulture]
paths = ["src", "tests", "examples"]
exclude = ["examples/output/", "docs/assets/"]
min_confidence = 80
sort_by_size = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
